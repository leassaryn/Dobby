name: Android Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        configuration: [Debug, Release]
        library: [static, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Test builder and ELF checker
        run: |
          python3 tests/android_builder_test.py
          python3 tests/elf_alignment_test.py
      - name: Build library and device tests
        run: >-
          python3 scripts/build-android.py
          --ndk "${{ steps.ndk.outputs.ndk-path }}"
          --abi ${{ matrix.abi }} --configuration ${{ matrix.configuration }}
          --library ${{ matrix.library }} --api 30 --tests --prefab
      - uses: actions/upload-artifact@v4
        with:
          name: Android-${{ matrix.abi }}-${{ matrix.configuration }}-${{ matrix.library }}
          path: build-output/
