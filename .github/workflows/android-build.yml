name: Android Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        configuration: [Debug, Release]
        shared: ["OFF", "ON"]
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Configure Android toolchain
        run: |
          cmake -S . -B build/${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-30 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} \
            -DDOBBY_GENERATE_SHARED=${{ matrix.shared }} -DDOBBY_BUILD_TESTS=ON \
            -DDynamicBinaryInstrument=ON -DPlugin.SymbolResolver=ON \
            -DPlugin.Android.BionicLinkerRestriction=ON
      - name: Build library and on-device executables
        run: cmake --build build/${{ matrix.abi }} --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: Android-${{ matrix.abi }}-${{ matrix.configuration }}-shared-${{ matrix.shared }}
          path: |
            build/${{ matrix.abi }}/libdobby*.so
            build/${{ matrix.abi }}/libdobby.a
            build/${{ matrix.abi }}/dobby_*_test
            include/dobby.h
