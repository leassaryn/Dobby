name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
        configuration: [Debug, Release]
        library: [static, shared]
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r29
      - name: Build and package
        run: >-
          python3 scripts/build-android.py
          --ndk "${{ steps.ndk.outputs.ndk-path }}" --abi ${{ matrix.abi }}
          --configuration ${{ matrix.configuration }} --library ${{ matrix.library }}
          --api 21 --prefab
      - uses: actions/upload-artifact@v4
        with:
          name: Android-${{ matrix.configuration }}-${{ matrix.library }}-${{ matrix.abi }}
          path: build-output/
          if-no-files-found: error

  collect:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Android-*
          path: artifacts/
          merge-multiple: true
      - name: Archive complete builds
        working-directory: artifacts
        run: |
          python3 -m zipfile -c ../dobby-android-debug.zip debug
          python3 -m zipfile -c ../dobby-android-release.zip release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dobby-android-debug.zip
            dobby-android-release.zip
          generate_release_notes: true
