name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    name: Android Debug Build

    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK r29
        run: |
          sdkmanager --install "ndk;29.0.13113456" 2>/dev/null || \
          sdkmanager --install "ndk;29.0.13113456" --channel=3
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -DCMAKE_SYSTEM_NAME=Android \
                -DANDROID_ABI=${{ matrix.arch }} \
                -DANDROID_PLATFORM=android-29 \
                -DANDROID_NDK=$ANDROID_HOME/ndk/29.0.13113456 \
                -DCMAKE_BUILD_TYPE=Debug \
                -DDynamicBinaryInstrument=ON \
                -DPlugin.SymbolResolver=ON \
                -B build-debug/${{ matrix.arch }}

      - name: Build Debug
        run: |
          cmake --build build-debug/${{ matrix.arch }} --target dobby -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p build_result/debug
          cp include/dobby.h build_result/debug/
          cp build-debug/${{ matrix.arch }}/libdobby.so build_result/debug/libdobby_${{ matrix.arch }}.so || \
          cp build-debug/${{ matrix.arch }}/libdobby.a build_result/debug/libdobby_${{ matrix.arch }}.a

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-${{ matrix.arch }}
          path: build_result/debug/

  build-release:
    runs-on: ubuntu-latest
    name: Android Release Build

    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a, x86, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install NDK r29
        run: |
          sdkmanager --install "ndk;29.0.13113456" 2>/dev/null || \
          sdkmanager --install "ndk;29.0.13113456" --channel=3
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -DCMAKE_SYSTEM_NAME=Android \
                -DANDROID_ABI=${{ matrix.arch }} \
                -DANDROID_PLATFORM=android-29 \
                -DANDROID_NDK=$ANDROID_HOME/ndk/29.0.13113456 \
                -DCMAKE_BUILD_TYPE=Release \
                -DDynamicBinaryInstrument=ON \
                -DPlugin.SymbolResolver=ON \
                -B build-release/${{ matrix.arch }}

      - name: Build Release
        run: |
          cmake --build build-release/${{ matrix.arch }} --target dobby -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p build_result/release
          cp include/dobby.h build_result/release/
          cp build-release/${{ matrix.arch }}/libdobby.so build_result/release/libdobby_${{ matrix.arch }}.so || \
          cp build-release/${{ matrix.arch }}/libdobby.a build_result/release/libdobby_${{ matrix.arch }}.a

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-${{ matrix.arch }}
          path: build_result/release/

  collect:
    runs-on: ubuntu-latest
    name: Collect All Artifacts
    needs: [build-debug, build-release]
    if: always()

    steps:
      - name: Download Debug Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/debug/
          pattern: Android-Debug-*
          merge-multiple: true

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/release/
          pattern: Android-Release-*
          merge-multiple: true

      - name: Zip artifacts
        run: |
          cd artifacts
          zip -r ../dobby-android-debug.zip debug/
          zip -r ../dobby-android-release.zip release/

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-All-Artifacts
          path: artifacts/
          retention-days: 30

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dobby-android-debug.zip
            dobby-android-release.zip
          generate_release_notes: true
