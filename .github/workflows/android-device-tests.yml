name: Android Device Tests

on:
  workflow_dispatch:
    inputs:
      require_16k:
        description: Require a real 16 KB page runtime
        type: boolean
        default: false
      require_bti:
        description: Require BTI hardware and guarded-page tests
        type: boolean
        default: false
      require_pac:
        description: Require pointer authentication hardware
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  device-tests:
    # Dedicated runner with an attached authorized device, adb, CMake and ANDROID_NDK_HOME.
    runs-on: [self-hosted, linux, android-device]
    steps:
      - uses: actions/checkout@v4
      - name: Build test artifacts for supported Android ABIs
        run: python3 scripts/build-android.py --abi all --api 30 --tests --build-root build/device
      - name: Run tests and record runtime evidence
        shell: python
        env:
          REQUIRE_16K: ${{ inputs.require_16k }}
          REQUIRE_BTI: ${{ inputs.require_bti }}
          REQUIRE_PAC: ${{ inputs.require_pac }}
        run: |
          import os
          import subprocess
          args = ["--" + name.lower().replace("_", "-")
                  for name in ("REQUIRE_16K", "REQUIRE_BTI", "REQUIRE_PAC")
                  if os.environ[name] == "true"]
          if args:
              args += ["--abi", "arm64-v8a"]
          subprocess.run(["python3", "scripts/run-android-tests.py",
                          "--build-root", "build/device/release/static",
                          "--output", "build/android-test-results.json", *args], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-runtime-results
          path: build/android-test-results.json
